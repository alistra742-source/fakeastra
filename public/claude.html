<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Claude</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22 fill=%22%23d97757%22>✳</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="claude.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar drawer (hidden off-canvas, slides in) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="closeSidebarBtn" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="new-chat-pill" id="newChatBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>
      <div class="sidebar-brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="#d97757"><rect x="11.2" y="2" width="1.6" height="20" rx="0.8"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(45 12 12)"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(90 12 12)"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(135 12 12)"/></g></svg>
        <span>Claude</span>
      </div>
      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Search chats</span>
      </div>
      <nav class="sidebar-history" id="sidebarHistory"></nav>
      <div class="sidebar-footer">
        <div class="footer-item">
          <span class="avatar">G</span>
          <span>Guest</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="model-select" id="modelSelect">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><g fill="#d97757"><rect x="11.2" y="2" width="1.6" height="20" rx="0.8"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(45 12 12)"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(90 12 12)"/><rect x="11.2" y="2" width="1.6" height="20" rx="0.8" transform="rotate(135 12 12)"/></g></svg>
          <span>Fable 5.1</span>
          <span class="think-badge">Thinking Max</span>
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="topbar-right">
          <button class="icon-btn" id="refreshBtn" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 12a9 9 0 1 1 2.6 6.4M3 12v6h6"/></svg>
          </button>
        </div>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="chat-scroll" id="chatScroll">
          <h1 class="welcome" id="welcomeTitle">Good evening</h1>
          <div class="messages" id="messages"></div>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="attachment-row" id="attachmentRow"></div>
        <div class="suggest-list" id="suggestList">
          <button class="suggest-row" data-prompt="Explain how ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M12 6.5A4.5 4.5 0 0 0 4.5 10c0 3 3 4.2 3 6.5h9c0-2.3 3-3.5 3-6.5A4.5 4.5 0 0 0 15 6.5c-1.2 0-2.2.5-3 1.3-.8-.8-1.8-1.3-3-1.3z"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M9.5 19.5h5"/></svg>
            </span>
            <span class="suggest-text">Learn something new</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
          <button class="suggest-row" data-prompt="Draft and refine ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20l3.5-1 10-10-2.5-2.5-10 10L4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
            <span class="suggest-text">Write or edit</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
          <button class="suggest-row" data-prompt="Write a function that ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 8l-5 4 5 4M15 8l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="suggest-text">Help me code</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <textarea id="composerInput" class="composer-input" placeholder="How can I help you today?" rows="1"></textarea>
          <div class="composer-row">
            <input type="file" id="fileInput" multiple hidden />
            <button type="button" class="composer-plus" id="plusBtn" aria-label="Add">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="composer-row-right">
              <button type="button" class="composer-mic" id="micBtn" aria-label="Voice">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
              </button>
              <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                <svg class="wave-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>
                <svg class="arrow-icon" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </form>
        <p class="disclaimer">Claude can make mistakes. Please double-check responses.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var h = new Date().getHours();
      var greeting = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      var el = document.getElementById('welcomeTitle');
      if (el) el.textContent = greeting;
    })();
  </script>
  <script>window.__VARIANT__ = 'claude';</script>
  <script src="app.js"></script>
</body>
</html>
