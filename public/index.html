<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GPT-6 Astra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>✦</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-icon-btn" id="toggleSidebarBtn" title="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="4" x2="9.5" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <div class="sidebar-header-spacer"></div>
        <button class="sidebar-icon-btn" id="searchIconBtn" title="Search chats">
          <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="sidebar-icon-btn" id="newChatIconBtn" title="New chat">
          <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19l-4.2 1z"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" id="newChatBtn">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19l-4.2 1z"/></svg></span>
          New chat
        </button>
        <button class="nav-item" id="searchChatsBtn">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          Search chats
        </button>
        <button class="nav-item" id="libraryBtn">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="5" width="7" height="14" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="5" width="7" height="14" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
          Library
        </button>
        <button class="nav-item" id="gptsBtn">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg></span>
          Explore GPTs
        </button>
      </nav>

      <div class="sidebar-history" id="sidebarHistory"></div>

      <div class="sidebar-bottom">
        <button class="upgrade-card" id="upgradeCard">
          <span class="upgrade-icon">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#2b8fff" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
          </span>
          <span class="upgrade-text">
            <strong>Upgrade plan</strong>
            <small>More access to the best models</small>
          </span>
        </button>
        <button class="user-row" id="userRow">
          <span class="avatar">G</span>
          <span>Guest</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="9.5" y1="4" x2="9.5" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="icon-btn sidebar-mini-newchat" id="miniNewChatBtn" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19l-4.2 1z"/></svg>
        </button>
        <button class="model-select" id="modelSelect">
          <span>GPT-6 Astra</span>
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="topbar-right">
          <button class="icon-btn" id="tempChatBtn" title="Temporary chat">
            <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 3a9 9 0 1 0 9 9"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 3v3M21 12h-3"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="shareBtn" title="Share">
            <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4M8 8l4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
          </button>
          <button class="topbar-avatar" id="topbarAvatar">G</button>
        </div>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="chat-scroll" id="chatScroll">
          <div class="landing" id="landing">
            <div class="landing-inner">
              <h1>What can I help with?</h1>
              <form class="composer landing-composer" id="landingComposerForm">
                <button type="button" class="composer-icon-btn" id="plusBtnLanding" aria-label="Add">
                  <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
                </button>
                <textarea id="landingInput" class="composer-input" placeholder="Ask anything" rows="1"></textarea>
                <div class="composer-actions">
                  <button type="button" class="composer-icon-btn mic-btn" id="micBtnLanding" aria-label="Voice">
                    <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
                  </button>
                  <button type="submit" class="send-btn" id="sendBtnLanding" aria-label="Send">
                    <svg class="wave-icon" viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>
                    <svg class="arrow-icon" viewBox="0 0 24 24" width="19" height="19" style="display:none"><path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
                  </button>
                </div>
              </form>
              <div class="pill-row" id="pillRow">
                <button class="pill" data-prompt="Create an image of ">
                  <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#5fc26b" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.6" fill="#5fc26b"/><path d="M21 15l-5-5-9 9" fill="none" stroke="#5fc26b" stroke-width="1.6"/></svg>
                  Create image
                </button>
                <button class="pill" data-prompt="Search the web for ">
                  <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="#4a9dff" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" fill="none" stroke="#4a9dff" stroke-width="1.6"/></svg>
                  Search
                </button>
                <button class="pill" data-prompt="Help me write ">
                  <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 20l3.5-1 10-10-2.5-2.5-10 10L4 20z" fill="none" stroke="#e2ab2f" stroke-width="1.6" stroke-linejoin="round"/></svg>
                  Write
                </button>
                <button class="pill" data-prompt="Write code for ">
                  <svg viewBox="0 0 24 24" width="16" height="16"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Code
                </button>
                <button class="pill" data-prompt="Explain ">
                  <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="#ff8a4a" stroke-width="1.6"/><path d="M12 16v-4M12 8h.01" fill="none" stroke="#ff8a4a" stroke-width="1.8" stroke-linecap="round"/></svg>
                  Explain
                </button>
              </div>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </div>
      </main>

      <div class="composer-wrap" id="composerWrap" style="display:none">
        <form class="composer" id="composerForm">
          <button type="button" class="composer-icon-btn" id="plusBtn" aria-label="Add">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="composerInput" class="composer-input" placeholder="Ask anything" rows="1"></textarea>
          <div class="composer-actions">
            <button type="button" class="composer-icon-btn mic-btn" id="micBtn" aria-label="Voice">
              <svg viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
            </button>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
              <svg class="wave-icon" viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>
              <svg class="arrow-icon" viewBox="0 0 24 24" width="19" height="19" style="display:none"><path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </form>
        <div class="composer-disclaimer">GPT-6 Astra can make mistakes. Check important info.</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
