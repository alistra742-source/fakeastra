<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#212121" />
<title>ChatGPT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>✦</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar (full-screen on phones, like the app) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-brand">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 1.8l2.1 5.6 5.6 2.1-5.6 2.1L12 17.2l-2.1-5.6L4.3 9.5l5.6-2.1z"/>
            <path fill="currentColor" opacity="0.55" d="M18.8 15.2l.95 2.5 2.5.95-2.5.95-.95 2.5-.95-2.5-2.5-.95 2.5-.95z"/>
          </svg>
          <span>ChatGPT</span>
        </div>
        <button class="icon-btn" id="closeSidebarBtn" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="new-chat-pill" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <button class="sidebar-row subtle" type="button">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Search chats
      </button>
      <button class="sidebar-row subtle" type="button">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.6" cy="8.6" r="1.7" fill="currentColor"/><path d="M21 15.5l-5-5-9 9" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        Images
      </button>
      <button class="sidebar-row subtle" type="button">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        Apps
      </button>
      <button class="sidebar-row subtle" type="button">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2.7l8 4.6v9.4l-8 4.6-8-4.6V7.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 12l8-4.7M12 12v9.3M12 12L4 7.3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
        GPTs
      </button>

      <nav class="sidebar-history" id="sidebarHistory"></nav>

      <div class="sidebar-footer">
        <div class="footer-item">
          <span class="avatar">G</span>
          <span>Guest</span>
          <span class="spacer"></span>
          <button class="footer-link" type="button">Upgrade</button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="model-select" id="modelSelect" type="button" aria-label="Choose a model">
          <span id="modelLabel">GPT-6 Astra</span>
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="topbar-right">
          <button class="icon-btn" id="refreshBtn" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 20h11a3 3 0 0 0 3-3V6.5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.5 8.5l3.5-3.7 3.4 3.7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 15.5V5a1 1 0 0 1 1-1h11"/></svg>
          </button>
        </div>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="chat-scroll" id="chatScroll">
          <div class="messages" id="messages"></div>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="attachment-row" id="attachmentRow"></div>
        <div class="suggest-list" id="suggestList">
          <button class="suggest-row" data-prompt="Create an image or sticker of ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="19" height="19"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><path d="M21 15l-5-5-9 9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="suggest-text">Create an image or sticker</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
          <button class="suggest-row" data-prompt="Help me write or edit ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 20l3.5-1 10-10-2.5-2.5-10 10L4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
            <span class="suggest-text">Write or edit</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
          <button class="suggest-row" data-prompt="Search the web for ">
            <span class="suggest-icon">
              <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="suggest-text">Search the web</span>
            <span class="suggest-close" data-dismiss aria-label="Dismiss">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <textarea id="composerInput" class="composer-input" placeholder="Ask anything" rows="1"></textarea>
          <div class="composer-row">
            <input type="file" id="fileInput" multiple hidden />
            <button type="button" class="composer-plus" id="plusBtn" aria-label="Add photos and files">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="composer-row-right">
              <button type="button" class="model-chip" id="modelChip" aria-label="Choose model and reasoning effort">
                <span class="chip-name" id="chipModelLabel">Astra</span>
                <span class="mode-badge" data-mode-badge>Medium</span>
                <svg viewBox="0 0 24 24" width="13" height="13"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
              </button>
              <button type="button" class="composer-mic" id="micBtn" aria-label="Dictate">
                <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
              </button>
              <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                <svg class="wave-icon" viewBox="0 0 24 24" width="19" height="19"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
                <svg class="arrow-icon" viewBox="0 0 24 24" width="19" height="19" style="display:none"><path fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>window.__VARIANT__ = 'astra';</script>
  <script src="app.js"></script>
</body>
</html>
