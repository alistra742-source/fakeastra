<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GPT-6 Astra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>✨</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar (slides in) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New chat
        </button>
      </div>
      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search chats</span>
      </div>
      <nav class="sidebar-history" id="sidebarHistory">
        <div class="history-label">Recents</div>
        <!-- history items injected -->
      </nav>
      <div class="sidebar-footer">
        <div class="footer-item">
          <div class="avatar">G</div>
          <span>Guest</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="model-select" id="modelSelect">
          <span>GPT-6 Astra</span>
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="topbar-right">
          <button class="upgrade-btn" id="upgradeBtn">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#2b8fff" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
            Upgrade
          </button>
          <button class="icon-btn" id="refreshBtn" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 1 2.6 6.4M3 12v6h6"/></svg>
          </button>
        </div>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-empty" id="chatEmpty">
            <div class="brand-mark">✨</div>
          </div>
          <div class="messages" id="messages"></div>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="chip-row" id="chipRow">
          <button class="chip" data-prompt="Create an image or sticker of ">
            <span class="chip-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><path d="M21 15l-5-5-9 9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="chip-text">Create an image or sticker</span>
            <span class="chip-close" data-dismiss>✕</span>
          </button>
          <button class="chip" data-prompt="Help me write or edit ">
            <span class="chip-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20l3.5-1 10-10-2.5-2.5-10 10L4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
            <span class="chip-text">Write or edit</span>
            <span class="chip-close" data-dismiss>✕</span>
          </button>
          <button class="chip" data-prompt="Search the web for ">
            <span class="chip-icon">
              <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="chip-text">Search the web</span>
            <span class="chip-close" data-dismiss>✕</span>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <button type="button" class="composer-plus" id="plusBtn" aria-label="Add">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="composerInput" class="composer-input" placeholder="Ask anything" rows="1"></textarea>
          <button type="button" class="composer-mic" id="micBtn" aria-label="Voice">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
          </button>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
            <svg class="wave-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>
            <svg class="arrow-icon" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </form>
        <div class="composer-disclaimer">GPT-6 Astra can make mistakes. Check important info.</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
